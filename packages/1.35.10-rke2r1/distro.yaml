---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/distro-v1alpha1-schema.json
apiVersion: colonel-byte.dev/v1alpha1
kind: Distro
metadata:
  name: rancher-rke2
  version: 1.35.10-rke2r1
  architecture: amd64
  uncompressed: false
spec:
  type: rke2
  version: 1.35.10-rke2r1
  config:
    engine:
      config:
        # keep-sorted start block=yes
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
        cni:
          - cilium
        disable-cloud-controller: true
        disable-kube-proxy: true
        disable:
          - rke2-ingress-nginx
        embedded-registry: false
        etcd-arg:
          - "quota-backend-bytes=8589934592" # 8GB
          - "auto-compaction-retention=1h"
        kube-apiserver-arg:
          - anonymous-auth=false
          - audit-log-mode=blocking-strict
          - audit-log-maxage=30
          - authorization-mode=RBAC,Node
          - "tls-min-version=VersionTLS12"
          - "service-account-extend-token-expiration=false"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kube-controller-manager-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
          - bind-address=127.0.0.1
          - use-service-account-credentials=true
        kube-proxy-arg:
          - "ipvs-strict-arp=true"
        kube-scheduler-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kubelet-arg:
          - authorization-mode=Webhook
          - anonymous-auth=false
          - streaming-connection-idle-timeout=5m
          - read-only-port=0
        profile: cis
        protect-kernel-defaults: true
        selinux: true
        service-cidr: 10.43.0.0/16
        write-kubeconfig-mode: "0600"
        # keep-sorted end
      audit:
        rules:
          - level: None
      podSecurity:
        plugins:
          - name: PodSecurity
            configuration:
              apiVersion: pod-security.admission.config.k8s.io/v1beta1
              kind: PodSecurityConfiguration
              defaults:
                enforce: "restricted"
                enforce-version: "latest"
                audit: "restricted"
                audit-version: "latest"
                warn: "restricted"
                warn-version: "latest"
              exemptions:
                usernames: []
                runtimeClasses: []
                namespaces:
                  - kube-system
                  - rook-ceph
                  - zarf
      manifest:
        rke2-cilium: |-
          kubeProxyReplacement: true
          k8sServiceHost: "localhost"
          k8sServicePort: "6443"
          encryption:
            enabled: true
            type: wireguard
          tolerations:
            - operator: Exists
          operator:
            tolerations:
              - operator: Exists
    os:
      sysctl:
        # Istio related sysctl overrides
        "fs.inotify.max_user_watches": "11048576"
        "fs.inotify.max_user_instances": "8192"
        # Misc performance
        "vm.max_map_count": "262144"
        "fs.file-max": "2097152"
        # Network tuning
        "net.core.somaxconn": "32768"
        "net.ipv4.tcp_max_syn_backlog": "8192"
        "net.core.netdev_max_backlog": "16384"
        # NFTABLES
        "net.netfilter.nf_conntrack_max": "1000000"
        "net.netfilter.nf_conntrack_buckets": "250000"
        "net.netfilter.nf_conntrack_tcp_timeout_established": "86400"
        "net.netfilter.nf_conntrack_tcp_timeout_close_wait": "3600"
        # Network
        "net.ipv4.ip_forward": "1"
        "net.ipv6.conf.all.forwarding": "1"
        "net.bridge.bridge-nf-call-iptables": "1"
        "net.bridge.bridge-nf-call-ip6tables": "1"
        # RKE2 related sysctl overrides
        "vm.panic_on_oom": "0"
        "vm.overcommit_memory": "1"
        "kernel.panic": "10"
        "kernel.panic_on_oops": "1"
      fapolicyd: |
        # Allow RKE2 to function
        allow perm=any all : dir=/opt/cni/
        allow perm=any all : dir=/run/k3s/
        allow perm=any all : dir=/var/lib/kubelet/
        allow perm=any all : dir=/var/lib/rancher/
      files:
        - source: https://rpm.rancher.io/rke2/latest/1.35/centos/9/x86_64/rke2-common-1.35.10~rke2r1-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-common-1.35.10~rke2r1-0.el9.x86_64.rpm
          shasum: 4adc4be1830a7d20de7df3d010748dc9fd8b3c84c07c26fda08ffd45f5b6bdd2
          selector:
            package: rpm
        - source: https://rpm.rancher.io/rke2/latest/common/centos/9/noarch/rke2-selinux-0.24-1.el9.noarch.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-selinux-0.24-1.el9.noarch.rpm
          shasum: 6f813a0c8678fb3ea9978131028d0ce58ba355ac0b909422cef0f51bcb7c2a03
          selector:
            package: rpm
        - source: https://rpm.rancher.io/rke2/latest/1.35/centos/9/x86_64/rke2-server-1.35.10~rke2r1-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-server-1.35.10~rke2r1-0.el9.x86_64.rpm
          shasum: daacfaa92d70b9fd13ba4aa25dfbef28c48dc5a5a7eeca8c801684f654159e01
          selector:
            package: rpm
            profile: controller
        - source: https://rpm.rancher.io/rke2/latest/1.35/centos/9/x86_64/rke2-agent-1.35.10~rke2r1-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-agent-1.35.10~rke2r1-0.el9.x86_64.rpm
          shasum: 01180f7486a95b7c784b386b87a20102c58237c406ce8170806bb186a7b45ecf
          selector:
            package: rpm
            profile: worker
    files:
      - source: core/cache.json
        target: /var/lib/rancher/rke2/agent/images/.cache.json
      # rke2 ships no etcdctl, which is the tool you want on a control-plane node when etcd is
      # the thing that is wrong. The version tracks the hardened-etcd image this release
      # bundles, so the client matches the server. Phase 50 uploads it and no later phase
      # renames it, so it is in place as soon as the upload finishes.
      - source: https://github.com/etcd-io/etcd/releases/download/v3.6.14/etcd-v3.6.14-linux-amd64.tar.gz
        extractPath: etcd-v3.6.14-linux-amd64/etcdctl
        target: /usr/local/bin/etcdctl
        executable: true
        shasum: ffe840ff9295808e88cce2794a18a5ac87f12a5203c8314d0bf6aa119b41bac5
        selector:
          profile: controller
    imageConfig:
      path: /var/lib/rancher/rke2/agent/images
      compression: none
      images:
        - docker.io/rancher/rke2-runtime:v1.35.10-rke2r1
        - docker.io/rancher/hardened-kubernetes:v1.35.10-rke2r1-build20261029
        - docker.io/rancher/hardened-coredns:v1.14.7-build20261020
        - docker.io/rancher/hardened-cluster-autoscaler:v1.11.0-build20261020
        - docker.io/rancher/hardened-dns-node-cache:1.27.2-r1-build20261022
        - docker.io/rancher/hardened-etcd:v3.6.14-k3s3-build20261020
        - docker.io/rancher/hardened-k8s-metrics-server:v0.9.0-build20261020
        - docker.io/rancher/hardened-addon-resizer:1.8.24-build20261021
        - docker.io/rancher/klipper-helm:v0.13.3-build20261021
        - docker.io/rancher/klipper-lb:v0.4.17
        - docker.io/rancher/mirrored-pause:3.10.2
        - docker.io/rancher/kube-webhook-certgen:v1.14.5-hardened2
        - docker.io/rancher/nginx-ingress-controller:v1.14.5-hardened2
        - docker.io/rancher/rke2-cloud-provider:v1.35.10-0.20261016153020-10a456cdc331-build20261021
        - docker.io/rancher/hardened-snapshot-controller:v8.7.0-build20261021
        - docker.io/rancher/mirrored-cilium-certgen:v0.4.13
        - docker.io/rancher/mirrored-cilium-cilium:v1.20.4
        - docker.io/rancher/mirrored-cilium-cilium-envoy:v1.39.5-1792733054-8c73b2816bc8239e27f1fd53b271884688137459
        - docker.io/rancher/mirrored-cilium-clustermesh-apiserver:v1.20.4
        - docker.io/rancher/mirrored-cilium-hubble-relay:v1.20.4
        - docker.io/rancher/mirrored-cilium-hubble-ui:v0.13.6
        - docker.io/rancher/mirrored-cilium-hubble-ui-backend:v0.13.6
        - docker.io/rancher/mirrored-cilium-operator-aws:v1.20.4
        - docker.io/rancher/mirrored-cilium-operator-azure:v1.20.4
        - docker.io/rancher/mirrored-cilium-operator-generic:v1.20.4
        - docker.io/rancher/hardened-cni-plugins:v1.9.1-build20261022
